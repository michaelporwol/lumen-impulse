name: Generate Daily Gospel

# Erzeugt das Tagesevangelium (Referenz + Bibeltext) aus öffentlichen Quellen
# (Evangelizo/USCCB/Bolls). KEINE KI — Grundlage für die TTS-Audio-Generierung.
# (Magisterium-AI-Reflexion am 01.06.2026 entfernt.)
#
# Seit 24.08.2026 wird IMMER auch der FOLGETAG mit erzeugt. Grund: Nutzer
# östlich von Europa haben ihren Kalendertag Stunden vor uns. Ein Nutzer in
# UTC+8 öffnete die Lectio um 06:49 Ortszeit = 22:49 UTC des Vortags — da gab
# es weder Impuls (~23:15 UTC) noch Audio (~01:45 UTC) für seinen Tag, die App
# zeigte "Tagesevangelium konnte nicht geladen werden". Mit der Vorproduktion
# steht der Tag D spätestens am Abend (UTC) des Tages D-1 bereit, also vor
# Mitternacht in jeder Zeitzone bis UTC+14.
#
# Seit 28.08.2026 sind es DREI Folgetage statt einem, und der Lauf startet
# viermal täglich. Grund: GitHub verschluckt geplante Läufe. Am 27.08. lief
# zuletzt um 15:24 UTC (da war der 29.08. noch nicht "morgen"), beide
# Nachtläufe fielen aus — und weil nur EIN Tag Vorlauf existierte, fehlte
# sofort das Tagesevangelium für den 29.08. und damit dessen Audio. Ein Puffer
# von drei Tagen übersteht mehrere ausgefallene Läufe; die Läufe selbst sind
# no-ops (~13s), solange nichts fehlt.

on:
  schedule:
    # Primary: 23:01 UTC = 01:01 CEST (generate for next Berlin day)
    - cron: '1 23 * * *'
    # Backup: 04:30 UTC = 06:30 CEST (catch up if primary was skipped by GitHub)
    - cron: '30 4 * * *'
    # Zwei weitere Netze über den Tag. GitHub garantiert keinen einzigen
    # geplanten Lauf; vier Chancen täglich machen einen Ausfall folgenlos.
    - cron: '17 10 * * *'
    - cron: '47 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate gospel for today and the next three days
        run: |
          set -uo pipefail
          TODAY=$(TZ=Europe/Berlin date +%Y-%m-%d)
          # Vorrat: heute + 3 Folgetage. Nur heute ist Pflicht, der Rest ist
          # Puffer gegen ausgefallene Läufe.
          TAGE="$TODAY"
          for I in 1 2 3; do
            TAGE="$TAGE $(TZ=Europe/Berlin date -d "+$I day" +%Y-%m-%d)"
          done
          RC=0
          for D in $TAGE; do
            F="impulses/${D}.json"
            # Nur überspringen, wenn die Datei existiert UND gültige gospelTexts hat.
            # Eine kaputte null-Datei (z. B. nach transientem Quellenausfall) darf den
            # Backup-Lauf NICHT blockieren — sonst keine Selbstheilung (Vorfall 17.06.2026).
            if [ -f "$F" ] && python3 -c "import json,sys; d=json.load(open('$F')); gt=d.get('gospelTexts') or {}; sys.exit(0 if (gt.get('de') or {}).get('text') else 1)"; then
              echo "✓ ${D} bereits vollständig — übersprungen."
              continue
            fi
            echo "→ Erzeuge ${D}..."
            if ! node scripts/generate-impulse.js "$D"; then
              # Der heutige Tag ist Pflicht, der Folgetag ist Vorproduktion:
              # scheitert nur der Folgetag, holt ihn der nächste Lauf nach.
              if [ "$D" = "$TODAY" ]; then
                echo "::error::Tagesevangelium für ${D} konnte nicht erzeugt werden"
                RC=1
              else
                echo "::warning::Vorproduktion für ${D} fehlgeschlagen — nächster Lauf holt sie nach"
              fi
            fi
          done
          exit $RC

      - name: latest.json auf den heutigen Berliner Tag setzen
        if: always()
        run: |
          # latest.json bedeutet "der heutige Berliner Tag". Der Generator schreibt
          # sie nur, wenn er diesen Tag WIRKLICH neu erzeugt — seit der
          # Vorproduktion (24.08.2026) existiert die Datei aber meist schon vom
          # Vortag, der Schritt oben ueberspringt sie, und latest.json fror ein
          # (24.–26.08.2026 auf dem 24.). Deshalb hier stumpf nachziehen.
          TODAY=$(TZ=Europe/Berlin date +%Y-%m-%d)
          if [ -f "impulses/${TODAY}.json" ]; then
            cp "impulses/${TODAY}.json" impulses/latest.json
            echo "latest.json = ${TODAY}"
          else
            echo "::warning::impulses/${TODAY}.json fehlt — latest.json unveraendert"
          fi

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add impulses/
          git diff --cached --quiet || git commit -m "gospel: $(TZ=Europe/Berlin date +%Y-%m-%d) (+3 Folgetage)"
          git push
